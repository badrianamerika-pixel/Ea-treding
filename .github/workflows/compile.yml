name: GOLD BOT MQL5 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldBot_v1-1.mq5'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process -FilePath $installer `
            -ArgumentList '/auto', '/path:C:\MT5' `
            -Wait

      - name: Compile GOLD BOT
        shell: pwsh
        run: |
          $editor = Get-ChildItem C:\MT5 `
            -Filter metaeditor64.exe -Recurse |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor tidak ditemukan"
          }

          $source = (Resolve-Path "GoldBot_v1-1.mq5").Path
          $output = Join-Path (Get-Location) "GoldBot_v1-1.ex5"

          Start-Process -FilePath $editor.FullName `
            -ArgumentList "/compile:$source", "/log" `
            -Wait

          if (!(Test-Path $output)) {
            throw "File EX5 tidak ditemukan. Periksa log MetaEditor."
          }

          Write-Host "GOLD BOT berhasil dikompilasi!"

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-BOT-EX5
          path: GoldBot_v1-1.ex5
