name: GOLD BOT MQL5 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldBot_v1-1.mq5'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:TEMP\mt5setup.exe"
          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process $installer `
            -ArgumentList '/auto', '/path:C:\MT5' -Wait

      - name: Compile GOLD BOT and show log
        shell: pwsh
        run: |
          $editor = Get-ChildItem C:\MT5 `
            -Filter metaeditor64.exe -Recurse |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor tidak ditemukan"
          }

          $source = (Resolve-Path "GoldBot_v1-1.mq5").Path
          $output = [IO.Path]::ChangeExtension($source, ".ex5")
          $log = [IO.Path]::ChangeExtension($source, ".log")

          Remove-Item $output, $log -Force -ErrorAction SilentlyContinue

          $args = '/compile:"' + $source + '" /log'

          $process = Start-Process $editor.FullName `
            -ArgumentList $args -Wait -PassThru

          Write-Host "MetaEditor exit code: $($process.ExitCode)"

          if (Test-Path $log) {
            Write-Host "=== COMPILER LOG ==="
            Get-Content $log
          } else {
            Write-Host "Compiler log tidak ditemukan"
          }

          if (!(Test-Path $output)) {
            throw "EX5 belum dihasilkan. Baca compiler log di atas."
          }

          Write-Host "EX5 berhasil dibuat!"

      - name: Upload compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-BOT-BUILD-LOG
          path: |
            GoldBot_v1-1.log
            GoldBot_v1-1.ex5
          if-no-files-found: warn
