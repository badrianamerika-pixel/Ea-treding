name: GOLD BOT MQL5 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldBot_v1-1.mq5'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process $installer `
            -ArgumentList '/auto', '/path:C:\MT5' `
            -Wait

      - name: Initialize MT5 Standard Library
        shell: pwsh
        run: |
          $terminal = Get-ChildItem C:\MT5 `
            -Filter terminal64.exe -Recurse |
            Select-Object -First 1

          if (!$terminal) {
            throw "Terminal MT5 tidak ditemukan"
          }

          $tradeFile = Join-Path `
            (Split-Path $terminal.FullName) `
            "MQL5\Include\Trade\Trade.mqh"

          Write-Host "Menjalankan MT5 portable..."

          $process = Start-Process $terminal.FullName `
            -ArgumentList '/portable' -PassThru

          $ready = $false

          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path $tradeFile) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$ready) {
            throw "Trade.mqh belum tersedia setelah inisialisasi MT5"
          }

          $mql5Root = Split-Path (Split-Path (Split-Path $tradeFile))
          "MQL5_ROOT=$mql5Root" >> $env:GITHUB_ENV

          Write-Host "Standard Library berhasil disiapkan."
          Write-Host "MQL5 root: $mql5Root"
          Write-Host $tradeFile

          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Compile GOLD BOT
        shell: pwsh
        run: |
          $editor = Get-ChildItem C:\MT5 `
            -Filter metaeditor64.exe -Recurse |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor tidak ditemukan"
          }

          $source = (Resolve-Path "GoldBot_v1-1.mq5").Path
          $output = [IO.Path]::ChangeExtension($source, ".ex5")
          $log = [IO.Path]::ChangeExtension($source, ".log")

          Remove-Item $output, $log `
            -Force -ErrorAction SilentlyContinue

          $compileArgs = '/compile:"' + $source + '" /include:"' + $env:MQL5_ROOT + '" /log'

          Write-Host "Include root: $env:MQL5_ROOT"

          Start-Process $editor.FullName `
            -ArgumentList $compileArgs `
            -Wait

          if (Test-Path $log) {
            Get-Content $log
          }

          if (!(Test-Path $output)) {
            throw "Kompilasi gagal. Periksa log."
          }

          Write-Host "GOLD BOT EX5 berhasil dibuat!"

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-BOT-BUILD
          path: |
            GoldBot_v1-1.ex5
            GoldBot_v1-1.log
          if-no-files-found: warn
