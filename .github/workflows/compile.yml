name: GOLD BOT MQL5 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'GoldBot_v1-1.mq5'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:TEMP\mt5setup.exe"

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          Start-Process $installer `
            -ArgumentList '/auto', '/path:C:\MT5' -Wait

      - name: Find MQL5 Standard Library
        id: library
        shell: pwsh
        run: |
          $tradeFile = Get-ChildItem C:\MT5 `
            -Filter Trade.mqh -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$tradeFile) {
            throw "Trade.mqh tidak ditemukan dalam instalasi MT5"
          }

          $mql5Root = Split-Path `
            (Split-Path `
            (Split-Path $tradeFile.FullName))

          "MQL5_ROOT=$mql5Root" >> $env:GITHUB_ENV

          Write-Host "Library ditemukan: $($tradeFile.FullName)"
          Write-Host "MQL5 root: $mql5Root"

      - name: Compile GOLD BOT
        shell: pwsh
        run: |
          $editor = Get-ChildItem C:\MT5 `
            -Filter metaeditor64.exe -Recurse |
            Select-Object -First 1

          if (!$editor) {
            throw "MetaEditor tidak ditemukan"
          }

          $source = (Resolve-Path "GoldBot_v1-1.mq5").Path
          $output = [IO.Path]::ChangeExtension($source, ".ex5")
          $log = [IO.Path]::ChangeExtension($source, ".log")

          Remove-Item $output, $log -Force -ErrorAction SilentlyContinue

          $args = '/compile:"' + $source + '" /include:"' + $env:MQL5_ROOT + '" /log'

          Start-Process $editor.FullName `
            -ArgumentList $args -Wait

          if (Test-Path $log) {
            Get-Content $log
          }

          if (!(Test-Path $output)) {
            throw "EX5 belum dihasilkan. Periksa compiler log."
          }

          Write-Host "GOLD BOT EX5 berhasil dibuat!"

      - name: Upload compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-BOT-BUILD
          path: |
            GoldBot_v1-1.ex5
            GoldBot_v1-1.log
          if-no-files-found: warn
